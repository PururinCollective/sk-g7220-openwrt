# not continue, unless the user is a member of github.com/PururinCollective.
#
# vendor-manifest.ini — seeds for the curated /vendor closure (vendor_closure.py).
#
# Each [group] lists seed paths inside the STOCK rootfs (files, dirs = recursive,
# globs ok). The closure tool follows ELF DT_NEEDED / interpreters / script and
# string references from the seeds. Groups run in file order; a file is billed
# to the first group that pulls it.
#
# default = yes  -> built into the graft unless --groups overrides
# deny_unless_enabled -> paths that may only enter /vendor if this group is ON
#                        (stops reference noise from dragging them in)
# [global] deny  -> never pulled by reference (a seed still can)

[global]
# opkg package DB of the stock 21.02 tree: meaningless on the apk-based host
deny = /usr/lib/opkg
# Stock packages whose role the OpenWrt-25 host takes over (sidecar model):
# references to their files do NOT pull the 21.02 copies into /vendor — vendor
# scripts calling `uci`, `ubus`, `procd` helpers, `wget`... get the host's.
# A vendor ELF's DT_NEEDED libs are always carried regardless (e.g.
# libubox.so.20210516), and explicit seeds always win.
host_pkgs = base-files busybox procd ubox ubus ubusd uci jshn jsonfilter
        netifd firewall dnsmasq odhcpd-ipv6only odhcp6c rpcd rpcd-mod-*
        uhttpd uhttpd-mod-ubus cgi-io dropbear opkg openwrt-keyring usign
        fstools fwtool block-mount blkid lsblk mount-utils logd urngd
        urandom-seed luci luci-* zoneinfo-* getrandom flock getopt
        wget-ssl uclient-fetch curl tar xz xz-utils bzip2 resolveip
        ubi-utils mtd
# Host packages the vendor also stuffed its own files into (Skyworth patched
# xponconfig, LED maps, skyworth_*_config, /sbin/sysupgrade... into base-files).
# Their files are denied only where the OpenWrt-25 host ships the same path.
vendor_extended_pkgs = base-files
# Paths where the VENDOR copy must be live (replaces the host's in the FHS),
# because the vendor stack calls them by path and the host version can't drive
# the proprietary hardware (MTK mt_wifi is not mac80211/netifd-wireless).
vendor_wins = /sbin/wifi

[aero-ubusd]
# The OpenWrt-25.12 ubusd does NOT service its listen socket on the stock 5.4.55
# kernel: it registers the socket edge-triggered in epoll and parks in
# epoll_wait, but the accept-ready event never wakes it, so it never accept()s a
# client -> procd hangs forever at `- ubus -`. The stock 21.02 ubusd does the
# identical edge-triggered thing and WORKS on this kernel, and its wire protocol
# is compatible with the 25.12 ubus clients (verified on-device; see
# docs/aero-pon-bringup-findings.md). Aero-PON therefore runs the VENDOR ubusd as
# the system message bus (build-graft-rootfs.sh installs a /sbin/ubusd shim).
# This seed pulls the vendor ubusd + its ELF lib closure (libubox / libubus /
# libblobmsg_json / libjson-c / musl) into /vendor even though `ubus*` are in
# host_pkgs above (explicit seeds always win). Do not disable unless the 25.12
# ubusd is fixed/rebuilt.
default = yes
seeds = /sbin/ubusd

[pon]
desc = GPON/OMCI + WAN data path: xPON init, airoha_network/omci, skinit, skapid, QDMA/NPU
default = yes
seeds = /etc/init.d/xponconfig /etc/init.d/pon /etc/init.d/skinit /etc/init.d/skapi
        /etc/init.d/initconfig /etc/init.d/sgmiiconfig
        /userfs/*.conf /userfs/*.bin /userfs/profile.cfg /userfs/CountrySetting
        /etc/config

[wifi]
desc = MT7992 Wi-Fi 7: EEPROM/fw path setup, calibration, vendor /sbin/wifi + Lua backend
default = yes
seeds = /etc/init.d/wifi_e2p /etc/init.d/wifi_fw_path /etc/init.d/wifi_testmode
        /etc/init.d/arht_wlan_cal /etc/init.d/mt76config /etc/init.d/skwifi
        /sbin/wifi /lib/wifi

[voip]
desc = VoIP DSP loader + voip daemon
default = yes
seeds = /etc/init.d/voip

[hw-ui]
desc = LEDs + buttons
default = yes
seeds = /etc/init.d/gpio_switch /etc/init.d/led

[platform]
desc = A/B bank + flash tools (ecnt_sys swap bootflag, ecnt_mtd, vendor sysupgrade, blapi_cmd)
default = yes
seeds = /sbin/ecnt_sys /sbin/ecnt_mtd /sbin/sysupgrade /userfs/bin/blapi_cmd
        /etc/init.d/skupgrade /etc/init.d/bootcount

[isp-mgmt]
desc = ISP remote management: TR-069 (easycwmp + helpers), TR-369 (obuspa), bulkdata, config sync
default = yes
seeds = /etc/init.d/easycwmpd /etc/init.d/tr069_stund /etc/init.d/tr069_udp
        /etc/init.d/tr069_udpechoclient /etc/init.d/tr069_xmppd /etc/init.d/obuspa
        /etc/init.d/bulkdatad /etc/init.d/zz_config_inotify /etc/init.d/zzz_sky_up_status_check

[kernel]
desc = stock 5.4.55 kmods, autoload lists, firmware + files the drivers open by path
default = yes
seeds = /lib/modules/5.4.55 /lib/firmware /etc/modules.d /etc/modules-boot.d
        /etc/iNIC /etc/wireless

[chroot-base]
desc = minimal shell env so /vendor can also run as a thin chroot (busybox, rc.common, shell libs)
default = no
seeds = /bin/busybox /bin/sh /etc/rc.common /lib/functions.sh /lib/functions
        /lib/config/uci.sh /usr/share/libubox/jshn.sh /etc/passwd /etc/group

[mesh]
desc = EasyMesh (prplMesh/beerocks) + APPManage/meshmanage
default = no
seeds = /etc/init.d/prplmesh /etc/init.d/MeshUpgrade /etc/init.d/APPManage
        /config /scripts /share
deny_unless_enabled = /config /scripts /share /etc/init.d/prplmesh
        /etc/init.d/MeshUpgrade /etc/init.d/APPManage /usr/sbin/APPManage /usr/sbin/meshmanage
deny_pkgs_unless_enabled = prplmesh meshupgrade appmanage

[vendor-gui]
desc = stock LuCI (skTmCombo/skg*) for a NijikaWrt-style dual GUI
default = no
seeds = /www /usr/lib/lua/luci /etc/init.d/uhttpd /etc/init.d/rpcd
        /usr/share/rpcd /usr/libexec/rpcd
deny_unless_enabled = /www /usr/lib/lua/luci /usr/share/rpcd /usr/libexec/rpcd /usr/share/luci

[factory]
desc = factory telnet backdoor service (keep OFF)
default = no
seeds = /etc/init.d/sky_telnet_for_factory
deny_unless_enabled = /etc/init.d/sky_telnet_for_factory

[extras]
desc = generic OpenWrt services the 25.12 base can provide via apk instead (dlna, upnp, ftp, avahi, ddns, igmp/mld proxies)
default = no
seeds = /etc/init.d/minidlna /etc/init.d/miniupnpd /etc/init.d/vsftpd
        /etc/init.d/avahi-daemon /etc/init.d/dbus /etc/init.d/ddns
        /etc/init.d/usbautomount /etc/init.d/conntrackd /etc/init.d/igmpproxy
        /etc/init.d/omcproxy
deny_unless_enabled = /usr/sbin/minidlnad /usr/sbin/miniupnpd /usr/sbin/vsftpd
        /usr/sbin/avahi-daemon /usr/sbin/dbus-daemon /usr/bin/dbus-daemon
        /usr/sbin/conntrackd /usr/sbin/igmpproxy /usr/sbin/omcproxy
deny_pkgs_unless_enabled = minidlna miniupnpd vsftpd avahi-* dbus libdbus
        ddns-scripts* conntrackd conntrack igmpproxy omcproxy ntfs-3g auto_mount

[vpn]
desc = strongSwan IPsec + PPTP/L2TP clients (the stock GUI's VPN page)
default = no
seeds = /etc/init.d/ipsec /etc/init.d/swanctl
deny_pkgs_unless_enabled = strongswan* ppp-mod-pptp ppp-mod-pppol2tp

[debug-tools]
desc = on-target debug/diag binaries not needed at runtime (gdb, tcpdump, memtester, iperf3, pciutils)
default = no
seeds = /usr/bin/gdb /usr/sbin/tcpdump
deny_pkgs_unless_enabled = gdb tcpdump memtester iperf3 pciutils pciids openssl-util
